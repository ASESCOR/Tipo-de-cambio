name: Actualizar y publicar monitor cambiario

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "17 */2 * * *"
      timezone: "America/La_Paz"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    # Evita que el commit automático cree otra ejecución idéntica.
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # -----------------------------------------
      # COTIZACIÓN GENERAL + HISTÓRICO
      # -----------------------------------------

      - name: Actualizar cotizaciones e histórico
        run: node scripts/update-data.mjs

      # -----------------------------------------
      # BANCOS
      # -----------------------------------------

      - name: Actualizar precios de bancos
        run: node scripts/update-banks.mjs

      # -----------------------------------------
      # GUARDAR LOS DATOS
      # -----------------------------------------

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json
          git add data/banks.json

          if git diff --cached --quiet; then
            echo "No existen cambios nuevos para guardar."
          else
            git commit -m "Actualizar cotizaciones y bancos"

            echo "Sincronizando con la rama principal..."
            git pull --rebase origin main

            echo "Guardando datos actualizados..."
            git push origin HEAD:main
          fi

      # -----------------------------------------
      # GITHUB PAGES
      # -----------------------------------------

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
